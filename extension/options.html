<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SaferNET Shield Enrollment</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <h2>Workstation enrollment</h2>
    <p>Your administrator manages these settings. Contact them to change enrollment.</p>
    <dl>
      <dt>Platform API</dt><dd id="apiBaseUrl"></dd>
      <dt>Workstation</dt><dd id="workstationId"></dd>
      <dt>Device</dt><dd id="deviceId"></dd>
    </dl>
    <button type="button" id="sync-btn" class="btn btn-secondary">Sync policy</button>
    <p id="status-msg" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
